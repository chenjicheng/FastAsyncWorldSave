name: Build and storage regression tests

on:
  push:
    branches: ['fabric/1.21.11']
  pull_request:
    branches: ['fabric/1.21.11']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build, JUnit and headless server GameTests
        shell: bash
        run: bash ./gradlew build --console=plain
      - name: Preserve artifacts and test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fabric-1.21.11-${{ matrix.os }}
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/reports/gametest/
            build/test-results/
